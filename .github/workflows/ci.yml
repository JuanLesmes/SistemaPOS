name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    # La aplicación es de Windows (pywin32, spooler de impresión), así que las
    # pruebas corren en un runner de Windows. PostgreSQL viene preinstalado en la
    # imagen del runner con el usuario postgres y la clave root.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint y formato
        run: |
          ruff check .
          ruff format --check .

      - name: Iniciar PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $svc) {
            choco install postgresql16 --params "/Password:root" -y --no-progress
            $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          }
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          if ($env:PGBIN) { "$env:PGBIN" | Out-File -FilePath $env:GITHUB_PATH -Append }
          Write-Host "Servicio iniciado: $($svc.Name)"

      - name: Pruebas (unitarias, interfaz e integración con PostgreSQL)
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: root
        run: pytest -q
